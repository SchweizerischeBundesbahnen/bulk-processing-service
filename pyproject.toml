[project]
name = "bulk-processing-service"
version = "0.0.0"  # the version is controlled by the pipeline
description = "Bulk PDF export service: accepts HTML, converts via WeasyPrint, merges PDFs"
authors = [
    {name = "SBB Polarion Team", email = "polarion-opensource@sbb.ch"},
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.15,<3.16"

dependencies = [
    "fastapi==0.159.1",
    "httpx==0.28.1",
    "pikepdf==10.17.0",
    "pyjwt[crypto]==2.15.1",
    "pypdf==6.21.2",
    "python-multipart==0.0.32",
    "uvicorn==0.54.0",
]

[project.urls]
Homepage = "https://github.com/SchweizerischeBundesbahnen/bulk-processing-service"
Repository = "https://github.com/SchweizerischeBundesbahnen/bulk-processing-service"

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "ruff==0.17.1",
    "ty==0.0.90",
]

test = [
    "tox==4.67.1",
    "tox-uv==1.37.0",
    # for debug source code for pytest --> see tox.ini section [testenv]
    "docker==7.2.0",
    "pytest==9.1.1",
    "pytest-mock==3.17.0",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "httpx==0.28.1",
    "coverage==7.17.0",
]

[tool.uv]
# Set to false because this project is an application, not a library
package = false

[tool.ruff]
line-length = 240
fix = true
show-fixes = true
exclude = [
    "tests/*"  # Exclude all test files from linting
]

[tool.ruff.lint]
extend-select = [
    # --- Recommended ---
    "E", "W", # pycodestyle errors and warnings
    "F",      # Pyflakes
    "I",      # isort
    "C4",     # flake8-comprehensions
    "C90",    # mccabe
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "S",      # flake8-bandit
    "PL",     # Pylint
    "PTH",    # flake8-pathlib
    "TCH",    # type-checking imports
    "SIM",    # flake8-simplify
    "T20",    # flake8-print
    "ERA",    # eradicate
    "ANN",    # flake8-annotations: replaces mypy disallow_untyped_defs now that type checking is done by ty
]

# Any is correct at JSON and **kwargs boundaries
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # No assert rule (bandit)
    "PLR2004", # No magic values (pylint)
]

[tool.ruff.format]
line-ending = "lf"

[tool.ty.src]
exclude = ["tests/"]

[tool.ty.terminal]
# Fail on warning-level diagnostics too, as mypy did, so the gate does not depend on the ty default.
error-on-warning = true

[tool.ty.rules]
unused-ignore-comment = "error"  # a stale "# ty: ignore" fails the check

# ty has no disallow_untyped_defs equivalent: missing annotations are enforced by ruff's ANN rules (see [tool.ruff.lint] extend-select).
